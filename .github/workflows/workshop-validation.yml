name: Workshop validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tools/**'
      - 'docs/**'
      - 'tsconfig.workshop.json'
      - 'AGENTS.md'
      - 'README.md'
      - 'package*.json'
      - '.github/workflows/workshop-validation.yml'
  workflow_dispatch:

concurrency:
  group: workshop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Workshop TypeScript (strict)
        run: npm run check:workshop
      - name: Workshop invariants
        run: npm run test:workshop
      - name: Local virtual environment bootstrap (offline, idempotent)
        run: |
          python3 -m py_compile tools/setup_venv.py tools/tiny_model.py
          python3 tools/setup_venv.py
          python3 tools/setup_venv.py
          python3 tools/setup_venv.py --check
          .venv/bin/python tools/tiny_model.py --dry-run --steps 2
          .venv/bin/python -c "import sys; assert sys.prefix != sys.base_prefix"
      - name: Verify no accidental tracked virtual environment
        run: |
          test -z "$(git ls-files '.venv/**' 'exports/**')"
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked app
        run: npm ci --no-audit --no-fund
      - name: Build production site
        run: npm run build
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          node scripts/workshop-browser-smoke.mjs
      - name: Upload classroom screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classroom-browser-smoke
          path: artifacts/workshop-presentation.png
          if-no-files-found: ignore

  python-venv-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create, reuse and verify venv on Windows
        shell: pwsh
        run: |
          python tools/setup_venv.py
          python tools/setup_venv.py
          python tools/setup_venv.py --check
          .\.venv\Scripts\python.exe tools\tiny_model.py --dry-run --steps 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ensure environment is ignored by Git
        shell: pwsh
        run: |
          $tracked = git ls-files ".venv/**" "exports/**"
          if ($tracked) { throw "Virtual environment or exports were accidentally committed" }
