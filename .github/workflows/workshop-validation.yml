name: Workshop validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package*.json'
      - '.github/workflows/workshop-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        # Temporary resolution while regenerating the committed package lock.
        run: npm install --no-audit --no-fund
      - name: Svelte/TypeScript
        run: npm run check
      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build
