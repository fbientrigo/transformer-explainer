name: Workshop validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package*.json'
      - '.github/workflows/workshop-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install
        # Upstream lockfile has vite@5 vs vite-plugin-svelte@6 peer conflict.
        # Temporary CI workaround; resolve versions in a separate dependency PR.
        run: npm ci --no-audit --legacy-peer-deps
      - name: Svelte/TypeScript
        run: npm run check
      - name: Production build
        run: npm run build
